name: Daily APAC Intelligence Update

on:
  schedule:
    # Runs daily at 22:00 UTC (which is 06:00 AM Manila time)
    - cron: '0 22 * * *' 
  workflow_dispatch: # Allows you to click a button to run it manually anytime

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the data.json file back to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai

      - name: Run intelligence generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_dashboard.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Automated daily threat intelligence update" || echo "No changes to commit"
          git push
